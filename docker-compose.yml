services:
  peerspace:
    # Built and pushed by .github/workflows/docker-publish.yml on every push to main.
    image: ${PEERSPACE_IMAGE:-ghcr.io/liquidiert/peer-space:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVICE_FQDN_PEERSPACE_3000
      # Realm URL as seen by the browser (login redirect).
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8080/realms/peer-space}
      # Realm URL as seen from inside the Docker network (token exchange / userinfo).
      # Point this at KEYCLOAK_URL instead if you use an external Keycloak.
      - KEYCLOAK_INTERNAL_URL=${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/realms/peer-space}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-peer-space}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-peer-space-dev-secret}
      - SESSION_SECRET=${SESSION_SECRET}
      - DATA_DIR=/app/data
    volumes:
      - peerspace_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  keycloak:
    # Optimized image built from keycloak/Dockerfile by .github/workflows/docker-publish.yml.
    # It has the build-time options (postgres, local cache, health) and the realm import baked
    # in. Changing those means editing keycloak/Dockerfile, not just the env below.
    image: ${KEYCLOAK_IMAGE:-ghcr.io/liquidiert/peer-space-keycloak:latest}
    pull_policy: always
    # --import-realm creates the peer-space realm from keycloak/import on first start and
    # skips it on later starts (existing realms are never overwritten).
    command: ["start", "--optimized", "--import-realm"]
    restart: unless-stopped
    # Hard cap for the whole container (heap + metaspace + threads + native). Measured idle
    # with the settings below: ~370 MiB, versus ~540 MiB with Keycloak's defaults.
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-512m}
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_KEYCLOAK_8080
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Public URL of Keycloak. Tokens are issued for this URL, while
      # BACKCHANNEL_DYNAMIC lets PeerSpace talk to http://keycloak:8080 internally.
      - KC_HOSTNAME=${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      # TLS is expected to be terminated by a reverse proxy in front of Keycloak.
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      # --- Memory tuning (KC_DB, KC_CACHE=local and KC_HEALTH_ENABLED are baked into the image)
      # Default pool is up to 100 DB connections, each with buffers on both sides.
      - KC_DB_POOL_INITIAL_SIZE=2
      - KC_DB_POOL_MIN_SIZE=2
      - KC_DB_POOL_MAX_SIZE=${KEYCLOAK_DB_POOL_MAX_SIZE:-10}
      - KC_HTTP_POOL_MAX_THREADS=50
      # Explicit JVM sizing instead of a percentage of the container limit. Raise -Xmx (and
      # KEYCLOAK_MEM_LIMIT) if you have many users or sessions.
      - JAVA_OPTS_KC_HEAP=${KEYCLOAK_JAVA_HEAP:--Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=64m -Xss512k}
      # Substituted into keycloak/import/peer-space-realm.json on first import.
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-peer-space}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-peer-space-dev-secret}
      - PEERSPACE_URL=${PEERSPACE_URL:-http://localhost:3000}
    expose:
      - "8080"
    healthcheck:
      # The Keycloak image ships without curl/wget, so probe the management port via bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${KEYCLOAK_DB_MEM_LIMIT:-128m}
    # Small footprint: Keycloak only opens a handful of connections (see its pool size above).
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=20", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB"]
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  peerspace_data:
  keycloak_db_data:
